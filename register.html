<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Registration</title>
    <link rel="stylesheet" href="CSS/reset.css">
    <link rel="stylesheet" href="CSS/normalize.css">
    <link rel="stylesheet" href="CSS/register.css">
</head>
<body>
<div class="form-container">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M0.170067 0.170067C0.396823 -0.056689 0.764467 -0.056689 0.991223 0.170067L6 5.17884L11.0088 0.170067C11.2355 -0.056689 11.6032 -0.056689 11.8299 0.170067C12.0567 0.396823 12.0567 0.764467 11.8299 0.991223L6.82116 6L11.8299 11.0088C12.0567 11.2355 12.0567 11.6032 11.8299 11.8299C11.6032 12.0567 11.2355 12.0567 11.0088 11.8299L6 6.82116L0.991223 11.8299C0.764467 12.0567 0.396823 12.0567 0.170067 11.8299C-0.056689 11.6032 -0.056689 11.2355 0.170067 11.0088L5.17884 6L0.170067 0.991223C-0.056689 0.764467 -0.056689 0.396823 0.170067 0.170067Z" fill="#f6973f" />
        </svg>
        <h2 class="h2">Registration</h2>
        <p class="text-form">Enter your email and password to register</p>
        <form class="input-container" name="" action="" method="post">
            <input class="login-container" type="text" placeholder="Username" name="Username" id="text" required>
            <input class="login-container" type="email" placeholder="Enter your email address" name="email" id="email" required>
            <input class="login-container" type="password" placeholder="Password" name="psw" id="psw" required>
            <input class="login-container" type="password" placeholder="Confirm password" name="psw-repeat" id="psw-repeat" required>
            <button type="submit" class="registered">Register</button>
        </form>
        <p class="account-options">Or</p>
        <div class="register-with">
            <a class="social" href="#" target="_blank">
                <img src="image/004-instagram.svg" alt="logo">Continue with Instagram</a>
            <a class="social" href="#" target="_blank">
                <img src="image/facebook.svg" alt="logo">Continue with Facebook</a>
        </div>
</div>
</body>
</html>
